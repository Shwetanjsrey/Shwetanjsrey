name: Generate Quest Panel

on:
  push:
    paths:
      - "quest-data.json"
      - "scripts/generate_quest.py"
      - ".github/workflows/quest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate quest SVG
        run: python scripts/generate_quest.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quest.svg

          if git diff --cached --quiet; then
            echo "No changes to quest.svg"
            exit 0
          fi

          git commit -m "Update quest panel"

          git pull --rebase origin main

          git push origin main
