<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="1030"
viewBox="0 0 1200 1030">

<defs>

  <!-- Subtle glow used by important HUD elements -->
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Progress animation -->
  <style>

    .title {
      font-family: monospace;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #F8FAFC;
    }

    .mission {
      font-family: monospace;
      font-size: 17px;
      fill: #C084FC;
    }

    .quest-name {
      font-family: monospace;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .description {
      font-family: monospace;
      font-size: 15px;
      fill: #CBD5E1;
    }

    .level {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .xp {
      font-family: monospace;
      font-size: 14px;
      fill: #94A3B8;
    }

    .percentage {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .number {
      font-family: monospace;
      font-size: 25px;
      font-weight: 700;
    }

    .footer {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #CBD5E1;
    }

    .progress {
      animation: grow 1.5s ease-out;
      transform-origin: left center;
    }

    @keyframes grow {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

  </style>

</defs>


