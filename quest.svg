<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="1030"
viewBox="0 0 1200 1030">

<defs>

  <style>

    .title {
      font: 700 34px monospace;
      fill: #f8fafc;
    }

    .mission {
      font: 18px monospace;
      fill: #a78bfa;
    }

    .quest-name {
      font: 700 22px monospace;
    }

    .description {
      font: 17px sans-serif;
      fill: #cbd5e1;
    }

    .level {
      font: 700 16px monospace;
    }

    .xp {
      font: 15px monospace;
      fill: #94a3b8;
    }

    .percentage {
      font: 700 17px monospace;
    }

    .footer {
      font: 700 17px monospace;
      fill: #cbd5e1;
    }

    .track {
      fill: #111827;
      stroke: #334155;
      stroke-width: 1;
    }

    .progress {
      animation: grow 1.5s ease-out;
      transform-origin: left center;
    }

    @keyframes grow {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

  </style>

</defs>


